name: factory

# Run the reviewed checkout factory against this repository and propose its
# signed, code-only delivery as a pull request. apmx's reusable run.yml keeps
# the agent away from the checks of record, the signing identity and any write
# token:
#   target   resolves this repository's base commit (main) and hands its tree on
#   produce  the agent runs the factory package (only job that sees the model token)
#   check    a fresh runner reruns the factory's own checks on the output bytes
#   attest   OIDC signs a verification summary over the delivered files and the
#            receipt bundle beside it (GitHub artifact attestations, stored here)
#   deliver  commits only the delivered files onto the base commit (no receipt)
# audit.yml then finds both attestations by the SHA-256 of each changed file.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: live runs the real factory with a model; hermetic-rehearsal runs apmx's protocol fixture (no model).
        type: choice
        options: [live, hermetic-rehearsal]
        default: live
      model:
        description: Copilot model (empty for Copilot's default).
        type: string
        default: ""

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      deliver: ${{ steps.deliver.outputs.mode }}
    steps:
      - name: Live inference needs the COPILOT_GITHUB_TOKEN secret
        if: inputs.mode == 'live'
        env:
          HAS_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error title=Missing COPILOT_GITHUB_TOKEN::Live mode runs Copilot CLI in Actions and needs a fine-grained personal access token with the 'Copilot Requests' account permission. Set it with: gh secret set COPILOT_GITHUB_TOKEN --repo ${GITHUB_REPOSITORY}. Or run mode=hermetic-rehearsal (no model)."
            exit 1
          fi
          echo "COPILOT_GITHUB_TOKEN is set (value not shown)."
      # run.yml's deliver job pushes the branch and opens the pull request itself
      # when it has a write token for this repository. GitHub rebinds a passed
      # GITHUB_TOKEN to each called job's own read-only token, and pull requests
      # opened with GITHUB_TOKEN never start audit.yml, so without
      # DELIVERY_PR_TOKEN run.yml only builds the delivered commit (`bundle`)
      # and the publish job below pushes it.
      - id: deliver
        env:
          HAS_PR_TOKEN: ${{ secrets.DELIVERY_PR_TOKEN != '' }}
        run: |
          if [ "$HAS_PR_TOKEN" = "true" ]; then mode=pull-request; else mode=bundle; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "run.yml deliver mode: $mode"

  factory:
    needs: preflight
    uses: danielmeppiel/apmx/.github/workflows/run.yml@v0.7.1
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      factory: ${{ inputs.mode == 'live' && 'danielmeppiel/apmx-demo-factory#v1.0.0' || 'danielmeppiel/apmx/tests/fixtures/run-workflow-package#v0.7.1' }}
      workspace: ${{ inputs.mode == 'live' && '.' || 'rehearsal' }}
      checks-requirements: checks/requirements.txt
      model: ${{ inputs.model }}
      apmx-version: "0.7.1"
      apmx-ref: v0.7.1
      hermetic-actor: ${{ inputs.mode != 'live' }}
      # This repository is both the platform and the target, so run.yml's
      # deliver job builds the pull request commit (code only, no receipt).
      target-repository: ${{ github.repository }}
      target-ref: ${{ github.ref_name }}
      target-branch: apmx/${{ inputs.mode }}-${{ github.run_id }}
      deliver: ${{ needs.preflight.outputs.deliver }}
    secrets:
      agent-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}   # produce job only
      target-token: ${{ secrets.DELIVERY_PR_TOKEN }}     # target and deliver jobs only

  publish:
    needs: [preflight, factory]
    if: needs.preflight.outputs.deliver == 'bundle'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write   # push the apmx/ branch (never main: branch protection)
    env:
      BRANCH: apmx/${{ inputs.mode }}-${{ github.run_id }}
      DELIVERED: ${{ needs.factory.outputs.delivered-commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.factory.outputs.base-commit }}
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apmx-delivered
          path: ${{ runner.temp }}/delivered
      - name: Push the delivered commit (git only; runs nothing it delivers)
        run: |
          git fetch --quiet "$RUNNER_TEMP/delivered/delivered.bundle" "refs/heads/$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$DELIVERED"
          git push --quiet origin "FETCH_HEAD:refs/heads/$BRANCH"
          {
            echo "### Delivery branch pushed: \`$BRANCH\`"
            echo
            echo "The commit holds only the delivered files. GitHub does not start workflows for"
            echo "pull requests opened with the job's own GITHUB_TOKEN, so the audit gate would"
            echo "never run. Open the pull request yourself:"
            echo
            echo '```sh'
            echo "gh pr create --repo $GITHUB_REPOSITORY --base main --head $BRANCH --fill"
            echo '```'
            echo
            echo "Or set a DELIVERY_PR_TOKEN secret (Contents and Pull requests write, this"
            echo "repository only) and run.yml's deliver job opens it."
          } >> "$GITHUB_STEP_SUMMARY"
