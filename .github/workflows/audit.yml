name: apmx audit

# The only gate on main: accept a factory pull request by proof, not by
# re-reading its diff. The PR carries code only. `apmx audit` looks each
# changed file up by SHA-256 in the signer's attestation store, requires one
# signed verification summary covering every changed file, checks the receipt
# statements it binds against apm-policy.yml read from the PR *base*, and
# refuses a stale base. Exit 0 is the pass.
on: pull_request

permissions:
  contents: read
  attestations: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # base and head commits, to bind the PR's change
          persist-credentials: false
      # Native apmx release, installed only if its SHA-256 matches the release's
      # .sha256 file, its manifest and this pinned digest (linux-x86_64).
      - uses: danielmeppiel/apmx/.github/actions/setup@v0.7.0
        with:
          version: "0.7.0"
          sha256: 78f1628480cdd5bf2d21be97780d1b12bb121edf70e546b7967b8589953a90b0
      - run: apmx audit
        env:
          GH_TOKEN: ${{ github.token }}   # gh attestation verify, for the Identity row
