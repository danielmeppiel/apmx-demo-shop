# APM policy for this repository. APM keeps its own keys; apmx reads only
# `factories`, from the pull request's BASE commit, so a PR cannot loosen it.
factories:
  allow:
    # Definition digests of the factories we reviewed (the audit's Factory row shows them).
    # The checkout factory package, as run.yml resolves it (repository, commit and content):
    - "danielmeppiel/apmx-demo-factory#v1.0.0@sha256:0bec0549b9af1e093c5204610163203ca6a58ea7602ad1021cdd381c042b039e"
    # Hermetic rehearsal only: apmx's run.yml protocol fixture package (no model).
    - "danielmeppiel/apmx/tests/fixtures/run-workflow-package@sha256:7fb53408635919338bbb63203faf05b6d73c785de006abbb3e889b5687e7e723"
  require_signed: true
  signers:
    # Receipts must carry a GitHub artifact attestation from apmx's reusable
    # run.yml, running in this repository (where the attestation is stored).
    # Pinned to the run.yml release factory.yml calls.
    - workflow: danielmeppiel/apmx/.github/workflows/run.yml@refs/tags/v0.6.0
      repo: danielmeppiel/apmx-demo-shop
  revoked: []
  enforcement: block
