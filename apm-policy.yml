# APM policy for this repository. APM keeps its own keys; apmx reads only
# `factories`, from the pull request's BASE commit, so a PR cannot loosen it.
factories:
  allow:
    # Definition digests of the factories we reviewed (the audit's Factory row shows them).
    # The checkout factory package, as run.yml resolves it (repository, commit and content):
    - "danielmeppiel/apmx-demo-factory#v1.0.0@sha256:0bec0549b9af1e093c5204610163203ca6a58ea7602ad1021cdd381c042b039e"
    # Hermetic rehearsal only: apmx's run.yml protocol fixture package at v0.7.0 (no model).
    - "danielmeppiel/apmx/tests/fixtures/run-workflow-package@sha256:9da1c7e596cdc1c677282a2ccbad1de39a9d8a4a9a4189547a5173e7b7b29e0d"
  require_signed: true
  signers:
    # Every changed file must be covered by a signed verification summary from
    # apmx's reusable run.yml, running in this repository (where the
    # attestations are stored). Pinned to the run.yml release factory.yml calls:
    # the tag, and the commit it must resolve to (`git rev-parse v0.7.1^{commit}`),
    # because a tag can move and this SHA cannot. Re-pin both on upgrade.
    - workflow: danielmeppiel/apmx/.github/workflows/run.yml@refs/tags/v0.7.1
      workflow_sha: "a70c1939dddc6f5d7888b76fd5bb8bab3e69e886"
      repo: danielmeppiel/apmx-demo-shop
  revoked: []
  enforcement: block
